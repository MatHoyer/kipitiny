version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    # Clean architecture: dependencies point inward. Each rule lists what a
    # layer may import; anything else fails the lint.
    depguard:
      rules:
        domain:
          list-mode: strict
          files: ["**/internal/domain/**", "!**/internal/domain/anonymize/**"]
          allow: [$gostd, github.com/kipit-labs/kipitiny/internal/domain]
          deny:
            - pkg: github.com/moby
              desc: the domain's container types are its own, the docker adapter converts
        # The anonymization rules: pure, plus the YAML shorthand x-kipitiny writes them in.
        domain-anonymize:
          list-mode: strict
          files: ["**/internal/domain/anonymize/**"]
          allow: [$gostd, go.yaml.in/yaml/v3]
        # Use cases: the standard library, the domain, the kernels and the
        # few pure libraries below. Anything else goes behind a port.
        usecase:
          list-mode: strict
          files: ["**/internal/usecase/**"]
          allow:
            - $gostd
            - github.com/kipit-labs/kipitiny/internal/domain
            - github.com/kipit-labs/kipitiny/internal/usecase
            - github.com/kipit-labs/kipitiny/internal/config
            - github.com/kipit-labs/kipitiny/internal/ids
            - github.com/kipit-labs/kipitiny/internal/progress
            - go.yaml.in/yaml/v3
            - github.com/distribution/reference
            - github.com/opencontainers/go-digest
            - github.com/containerd/errdefs
            - golang.org/x/crypto
            - github.com/go-webauthn/webauthn
            # identity's SSO is an OpenID Connect client of its own (usecase-oauth2).
            - github.com/coreos/go-oidc/v3
            - golang.org/x/oauth2
          deny:
            - pkg: github.com/kipit-labs/kipitiny/internal/infrastructure
              desc: use cases go through the ports in domain, wiring is in cmd/kipitiny
            - pkg: github.com/kipit-labs/kipitiny/internal/delivery
              desc: use cases know nothing about HTTP or MCP
            - pkg: github.com/uptrace/bun
              desc: SQL stays in the store adapter
            - pkg: github.com/moby
              desc: use cases reach Docker through domain.ContainerRuntime (infrastructure/docker)
            - pkg: github.com/opencontainers/image-spec
              desc: use cases reach Docker through domain.ContainerRuntime (infrastructure/docker)
            - pkg: github.com/go-git/go-git
              desc: use cases read repositories through domain.Git (infrastructure/git)
            - pkg: filippo.io/age
              desc: use cases encrypt through domain.Encryption (infrastructure/age)
            - pkg: github.com/robfig/cron
              desc: use cases schedule through domain.Cron (infrastructure/cron)
            - pkg: modernc.org/sqlite
              desc: SQLite stays in the adapters (infrastructure/sqlite, sqlitedb, sqlitehelper)
            - pkg: github.com/pressly/goose
              desc: migrations stay in the adapters (infrastructure/sqlite, sqlitedb)
            - pkg: github.com/minio/minio-go
              desc: use cases reach backup targets through data.Storage (infrastructure/storage)
            - pkg: github.com/golang-jwt/jwt
              desc: tokens are signed in the adapters (infrastructure/notify, gitprovider)
            - pkg: github.com/klauspost/compress
              desc: request bodies are decompressed by the handlers (delivery/collector)
        # identity's SSO is an OAuth client of its own; the git forges go
        # through projects.GitProviders (infrastructure/gitprovider).
        usecase-oauth2:
          files: ["**/internal/usecase/**", "!**/internal/usecase/identity/**"]
          deny:
            - pkg: golang.org/x/oauth2
              desc: use cases reach the git forges through projects.GitProviders (infrastructure/gitprovider)
        # Shared kernels every layer imports, infrastructure included (progress
        # reports the steps of a backup or a password manager's login).
        kernel:
          list-mode: strict
          files: ["**/internal/ids/**", "**/internal/progress/**", "**/internal/config/**"]
          allow: [$gostd, github.com/oklog/ulid/v2]
        infrastructure:
          files: ["**/internal/infrastructure/**"]
          deny:
            - pkg: github.com/kipit-labs/kipitiny/internal/usecase
              desc: adapters implement domain ports, they never call use cases
            - pkg: github.com/kipit-labs/kipitiny/internal/delivery
              desc: adapters know nothing about HTTP or MCP
        # REST handlers and MCP tools are thin adapters over the use cases.
        delivery:
          files: ["**/internal/delivery/**"]
          deny:
            - pkg: github.com/kipit-labs/kipitiny/internal/infrastructure
              desc: handlers go through use cases, wiring is in cmd/kipitiny
            - pkg: github.com/moby/moby
              desc: handlers never touch Docker, they go through use cases
            - pkg: github.com/uptrace/bun
              desc: handlers never touch SQL
            - pkg: modernc.org/sqlite
              desc: handlers never touch SQL
    revive:
      enable-default-rules: true
      rules:
        # Small files: easier to review, and to read whole (people and LLMs).
        - name: file-length-limit
          arguments: [{ max: 500 }]
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    # std-error-handling: unchecked Close/Flush/print, which only read paths use here.
    presets: [std-error-handling, common-false-positives]
    rules:
      # Tests wire the real store and Docker client: the unit layer runs on a
      # temp SQLite, the contract tests on the real wiring.
      - path: _test\.go
        linters: [noctx, unparam, depguard]

formatters:
  enable:
    - gofmt

issues:
  # The rules apply to code written or moved since they came in; the code
  # older than that is brought up to them area by area (#522).
  new-from-rev: 284c097f8684633706c91c3917fd41d8d17fc361
