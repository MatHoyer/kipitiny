# Publishes the website (site/: landing page and docs) as
# ghcr.io/mathoyer/kipitiny-homepage for amd64 and arm64: on each release tag,
# as :1.2.3 and :latest like the manager, so the docs match the latest release;
# or by hand for a site-only fix, as :sha-<commit> and :latest. Each
# minor release since 0.10 also keeps its own docs at /docs/<minor>, taken from
# its last patch tag.
name: site

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Docs of each release
        run: site/scripts/versions.sh
      - name: Version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: site
          platforms: linux/amd64,linux/arm64
          build-args: KIPITINY_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/mathoyer/kipitiny-homepage:${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
            ghcr.io/mathoyer/kipitiny-homepage:latest
          push: true
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
