# Publishes the website (site/: landing page and docs) to GitHub Pages at
# kipitiny.mathieuhoyer.fr: on each release tag, so the docs match the latest
# release, or by hand for a site-only fix. Each minor release since 0.10 also
# keeps its own docs at /docs/<minor>, taken from its last patch tag.
name: site

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # versions.sh reads the release tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - name: Build
        run: KIPITINY_VERSION="$(cat VERSION)" make site
      # Pages has no per-path fallback: unknown paths get the site's 404 page.
      - run: cp site/build/client/__spa-fallback.html site/build/client/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/build/client
      # shortcut: the artifact list lags the upload (actions/deploy-pages#451), drop once fixed upstream.
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
