# Builds the Proton Pass helper (images/protonpass) for amd64 and arm64. Pull
# requests only build it, so a bad checksum fails there; main and manual runs
# publish ghcr.io/mathoyer/kipitiny-protonpass:<pass-cli version>, the tag the
# manager's KIPITINY_PROTONPASS_IMAGE default points at. Releases of kipitiny
# don't rebuild it.
name: protonpass

on:
  pull_request:
    paths: ["images/protonpass/**", ".github/workflows/protonpass.yml"]
  push:
    branches: [main]
    paths: ["images/protonpass/**", ".github/workflows/protonpass.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: protonpass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: pass-cli version
        id: version
        run: echo "version=$(sed -n 's/^ARG PASS_CLI_VERSION=//p' images/protonpass/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/protonpass
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mathoyer/kipitiny-protonpass:${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=protonpass
          cache-to: type=gha,mode=max,scope=protonpass
