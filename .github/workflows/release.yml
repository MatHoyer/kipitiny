# Merging a change of VERSION (a release PR) into main tags that commit 1.2.3
# and publishes ghcr.io/kipit-labs/kipitiny:1.2.3 and :latest for amd64 and
# arm64, then the website. Managers look for new versions there.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  packages: write
  actions: write # starts site.yml: a tag pushed with GITHUB_TOKEN triggers nothing

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, to check the new version against
      - name: Tag
        id: tag
        run: |
          v=$(cat VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # A re-run finds its own tag.
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            test "$(git rev-list -n1 "$v")" = "$GITHUB_SHA" || { echo "::error::tag $v is on another commit"; exit 1; }
            exit 0
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION $v is not X.Y.Z"; exit 1; }
          last=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          test "$(printf '%s\n%s\n' "$last" "$v" | sort -V | tail -1)" = "$v" || { echo "::error::$v is not above $last"; exit 1; }
          git tag "$v" && git push origin "$v"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # UPGRADE.md's notices: every release's in an image label, which
      # managers read before offering the update; this one's on the release.
      - name: Upgrade notices
        id: notices
        run: |
          echo "label=$(go run ./internal/usecase/upgrade/notes label)" >> "$GITHUB_OUTPUT"
          go run ./internal/usecase/upgrade/notes release "${{ steps.tag.outputs.version }}" > "$RUNNER_TEMP/notices.md"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tag.outputs.version }}
          labels: |
            io.kipitiny.upgrade-notices=${{ steps.notices.outputs.label }}
          tags: |
            ghcr.io/kipit-labs/kipitiny:${{ steps.tag.outputs.version }}
            ghcr.io/kipit-labs/kipitiny:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notices come first; the generated notes follow.
        run: gh release create "${{ steps.tag.outputs.version }}" --generate-notes --notes-file "$RUNNER_TEMP/notices.md" --verify-tag
      - name: Website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref "${{ steps.tag.outputs.version }}"

  # Static binaries for `kipitiny deploy` in CI (deploy/action.yml downloads
  # them), attached to the release the image job created.
  binaries:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The same binary as the image's, UI included.
      - name: UI
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${{ needs.image.outputs.version }}" -o dist/kipitiny-linux-$arch ./cmd/kipitiny
          done
          cd dist && sha256sum kipitiny-linux-* > SHA256SUMS
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.image.outputs.version }}" dist/*
