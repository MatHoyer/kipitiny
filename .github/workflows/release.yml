# Pushing a tag like 1.2.3 publishes ghcr.io/kipit-labs/kipitiny:1.2.3 and
# :latest for amd64 and arm64. Managers look for new versions there.
# Managers from before the move to kipit-labs look at ghcr.io/mathoyer/kipitiny:
# the release after the move goes there too, as their bridge; drop those two
# tags once it's out.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches VERSION
        run: test "$(cat VERSION)" = "${{ github.ref_name }}"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # UPGRADE.md's notices: every release's in an image label, which
      # managers read before offering the update; this one's on the release.
      - name: Upgrade notices
        id: notices
        run: |
          echo "label=$(go run ./internal/upgrade/notes label)" >> "$GITHUB_OUTPUT"
          go run ./internal/upgrade/notes release "${{ github.ref_name }}" > "$RUNNER_TEMP/notices.md"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            io.kipitiny.upgrade-notices=${{ steps.notices.outputs.label }}
          tags: |
            ghcr.io/kipit-labs/kipitiny:${{ github.ref_name }}
            ghcr.io/kipit-labs/kipitiny:latest
            ghcr.io/mathoyer/kipitiny:${{ github.ref_name }}
            ghcr.io/mathoyer/kipitiny:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notices come first; the generated notes follow.
        run: gh release create "${{ github.ref_name }}" --generate-notes --notes-file "$RUNNER_TEMP/notices.md" --verify-tag

  # Static binaries for `kipitiny deploy` in CI (deploy/action.yml downloads
  # them), attached to the release the image job created.
  binaries:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The same binary as the image's, UI included.
      - name: UI
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/kipitiny-linux-$arch ./cmd/kipitiny
          done
          cd dist && sha256sum kipitiny-linux-* > SHA256SUMS
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*
