server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # One URL per page: /docs/compose/ redirects to /docs/compose.
    rewrite ^/(.+)/$ /$1 permanent;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The manager's UI in demo mode: a single-page app under /demo.
    location /demo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /demo {
        try_files $uri /demo/index.html;
    }

    # Umami analytics, proxied from this origin so blockers of its own domain
    # don't drop visits. A variable makes nginx resolve the host per request,
    # so the site still starts when DNS is down.
    resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
    set $umami https://umami.mathieuhoyer.fr;
    proxy_ssl_server_name on;
    proxy_set_header Host umami.mathieuhoyer.fr;
    # The hop to Umami goes back through Cloudflare, which refuses requests
    # carrying its own headers (error 1000). Umami reads True-Client-IP first.
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-Ray "";
    proxy_set_header CF-Visitor "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header CDN-Loop "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header True-Client-IP $http_cf_connecting_ip;
    location = /u/s.js {
        proxy_pass $umami/script.js;
    }
    location = /u/api/send {
        proxy_pass $umami/api/send;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /__spa-fallback.html;
}
