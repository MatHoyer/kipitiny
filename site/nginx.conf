server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # One URL per page: /docs/compose/ redirects to /docs/compose.
    rewrite ^/(.+)/$ /$1 permanent;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The manager's UI in demo mode: a single-page app under /demo.
    location /demo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /demo {
        try_files $uri /demo/index.html;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /__spa-fallback.html;
}
