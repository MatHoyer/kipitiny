server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # One URL per page: /docs/compose/ redirects to /docs/compose.
    rewrite ^/(.+)/$ /$1 permanent;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The manager's UI in demo mode: a single-page app under /demo.
    location /demo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /demo {
        try_files $uri /demo/index.html;
    }

    # kipitiny analytics, proxied from this origin so blockers of another
    # domain don't drop visits. Straight to its container on the proxy network:
    # Cloudflare's CF-Connecting-IP and CF-IPCountry pass through as they came.
    # A variable makes nginx resolve the host per request, so the site still
    # starts while analytics are off.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $analytics http://kipitiny-analytics:8080;
    location = /u/a.js {
        proxy_pass $analytics/a.js;
    }
    location = /u/e {
        proxy_pass $analytics/e;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /__spa-fallback.html;
}
