# The kipitiny website, as it runs on kipitiny: a project linked to this file
# (Project › Git, path site/compose.yaml). A commit that changes it is applied
# by the next sync. Each release commit pins the image to its version, and
# reaches main only once the site workflow has pushed that image.
name: kipitiny-site
services:
  homepage:
    image: ghcr.io/mathoyer/kipitiny-homepage:0.23.0
    mem_limit: 64m
    expose: ["80"]
    x-kipitiny:
      domain: kipitiny.mathieuhoyer.fr
      icon: nginx
      middlewares:
        headers:
          X-Content-Type-Options: nosniff
          Referrer-Policy: strict-origin-when-cross-origin
