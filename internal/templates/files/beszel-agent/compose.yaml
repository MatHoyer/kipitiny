# Beszel's agent: reports the server it runs on (and its containers) to a
# Beszel hub. It needs the host's network and Docker socket, so install it
# in a project on the server to monitor, one per server.
x-template:
  title: Beszel agent
  description: Reports this server's CPU, memory, disks, network and containers to a Beszel hub.
  website: https://beszel.dev
  docs: https://beszel.dev/guide/agent-installation
  icon: beszel
  category: monitoring
  tags: [metrics, docker, agent]
  notes: |
    It runs with the server's network and Docker socket (see [Host access](/docs/compose#host-access)), so only on the server it watches: install it once per server, in a project on that server.

    1. In the hub, **Add System**: copy its **public key**, and give the system the server's address and port `45876`.
    2. Install the agent with that key. The hub connects to it on port 45876: open it in the server's firewall to the hub only.
    3. Or give the agent a **token** and the **hub URL** (both from the hub): it connects to the hub itself, and no port needs to be open.
  inputs:
    - name: KEY
      label: Hub public key
      required: true
      placeholder: ssh-ed25519 AAAA…
      help: In the hub, Add System shows it. Give the system this server's address and port 45876.
    - name: TOKEN
      label: Token
      type: secret
      help: With the hub URL, the agent connects to the hub itself (no open port needed).
    - name: HUB_URL
      label: Hub URL
      type: url
      placeholder: https://beszel.example.com
      help: Needed with the token.
name: beszel-agent
services:
  agent:
    image: henrygd/beszel-agent:0.21.0
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: ${KEY}
      TOKEN: ${TOKEN}
      HUB_URL: ${HUB_URL}
    x-kipitiny:
      icon: beszel
      secrets: [TOKEN]
