- name: Remove distro Docker packages that conflict with Docker CE
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-doc, podman-docker, containerd, runc]
    state: absent

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    update_cache: true

- name: Start Docker on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
